# HormonicFormer v3 Copy Task Config for RTX 5070 8GB
# Matches v3 API exactly

model:
  d_model: 128
  n_heads: 4
  n_layers: 2
  seq_len: 128
  n_steps: 3
  patch_size: 1
  n_classes: 11  # 0-9 + marker (10)
  
  # CGL parameters
  D0_amp: 0.002
  D0_phase: 0.002
  dt: 0.02
  noise_scale: 0.01
  
  # Regularization
  dropout: 0.1
  
  # E/I balance (v3 format)
  ei_balance:
    enabled: true
    tau_e: 2.0
    tau_i: 1.0
    gamma_e: 1.0
    gamma_i: 0.8
    w_inh: 0.3
    inh_radius: 3
  
  # Sensory feedback (v3 format)
  sensory_feedback:
    enabled: true
    feedback_strength: 0.3
  
  # Hebbian (v3 format)
  hebbian:
    enabled: true
    eta_hebb: 0.001
    eta_anti: 0.0005
    sync_threshold: 0.5
    tau_hebb: 10
    decay: 0.999

train:
  epochs: 30
  batch_size: 64
  
  # Data
  num_samples: 10000
  num_val_samples: 1000
  
  # Optimizer
  lr: 0.001
  weight_decay: 0.001
  grad_clip: 1.0
  
  seed: 42
